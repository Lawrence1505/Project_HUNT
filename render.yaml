# Render.com blueprint — one-click deploy of the whole HEAL stack on the free tier.
# In the Render dashboard: New → Blueprint → connect this repo. Render reads this file.
# After the first deploy, set SMTP_USER / SMTP_PASS / MAIL_FROM on the api service
# (Environment tab) to enable real OTP emails. JWT_SECRET and OTP_PEPPER are generated.
databases:
  - name: heal-db
    plan: free
    databaseName: heal
    user: heal

services:
  - type: web
    name: heal-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: heal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DEV_ECHO_OTP
        value: "false"
      - key: SMS_PROVIDER
        value: dev
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      # Set these three in the dashboard after deploy (secrets):
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: heal-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SMS_PROVIDER
        value: dev
    routes:
      # Proxy API calls to the api service; SPA-fallback everything else.
      - type: rewrite
        source: /api/*
        destination: https://heal-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
