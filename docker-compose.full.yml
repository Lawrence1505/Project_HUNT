# Full self-hosted HEAL stack: Postgres + API + web (nginx).
#   docker compose -f docker-compose.full.yml up -d --build
# Then open http://localhost:8080
#
# Set JWT_SECRET and OTP_PEPPER (and SMTP_* for real email) in a .env file next
# to this compose file, or export them in your shell first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healpass}
      POSTGRES_DB: heal
    volumes:
      - heal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heal -d heal"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://heal:${POSTGRES_PASSWORD:-healpass}@db:5432/heal
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OTP_PEPPER: ${OTP_PEPPER:?set OTP_PEPPER}
      TRUST_PROXY: "1"
      DEV_ECHO_OTP: "false"
      SMS_PROVIDER: ${SMS_PROVIDER:-dev}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-HEAL <no-reply@heal.app>}

  web:
    build:
      context: .
      args:
        VITE_SMS_PROVIDER: ${VITE_SMS_PROVIDER:-dev}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  heal-pgdata:
