# Serves the built SPA and reverse-proxies /api to the HEAL API container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — all app routes resolve to index.html (HashRouter also fine).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API proxy — "api" is the server service name in docker-compose.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cache static assets aggressively (hashed filenames from Vite).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
